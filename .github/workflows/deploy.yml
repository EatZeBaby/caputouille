name: Deploy to GitHub Pages

# Publishes the app/ folder to the gh-pages branch (site root).
# Pages must be configured to "Deploy from a branch: gh-pages / (root)".
# keep_files preserves any branch previews under preview/*.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app
          keep_files: true
