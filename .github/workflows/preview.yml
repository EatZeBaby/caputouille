name: Deploy preview (bambin)

# Publishes this branch's app/ folder to gh-pages under preview/bambin/,
# giving a live URL at <pages-root>/preview/bambin/ alongside the main site.
# keep_files preserves the root (main) site.

on:
  push:
    branches: [bambin-1-6-ans]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app
          destination_dir: preview/bambin
          keep_files: true
